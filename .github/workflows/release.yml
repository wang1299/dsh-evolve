name: first prerelease
on:
  push:
    tags: ['v0.1.0-alpha.1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: first-prerelease
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'wang1299/dsh-evolve' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.1.0-alpha.1
          fetch-depth: 0
      - name: Restore annotated release tag
        run: git fetch --no-tags origin +refs/tags/v0.1.0-alpha.1:refs/tags/v0.1.0-alpha.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: env GITHUB_REF=refs/tags/v0.1.0-alpha.1 node scripts/github-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
