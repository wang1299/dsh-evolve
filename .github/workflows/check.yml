name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest==9.1.1
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run compat
      - run: npm run demo
      - run: npm pack --dry-run
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - run: >-
          node -e "require('node:fs').mkdirSync('.probe-work', { recursive: true })"
      - run: npm pack --pack-destination .probe-work
      - run: npm run install-probe -- .probe-work/dsh-evolve-0.1.0-alpha.0.tgz
